name = "pdf-mindmap-worker"
main = "src/worker.js"
compatibility_date = "2024-01-01"

[env.production]
route = "https://api.mindmap.dev/*"
zone_id = "your_zone_id_here"

[env.staging]
route = "https://staging-api.mindmap.dev/*"
zone_id = "your_zone_id_here"

[build]
cwd = "."
command = "npm install && npm run build"

[build.upload]
format = "modules"
main = "./dist/worker.js"
